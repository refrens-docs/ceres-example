name: Deploy to GitHub Pages

on:
  # Trigger the workflow on push or pull request,
  # but only for the master branch
  push:
    branches:
      - master
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      # A Refrens template set to a version's own manifest (templates/<name>/<version>/manifest.json)
      # keeps working and gets the latest build: each listed version is a copy of the template's
      # current version (only the current one is built).
      - name: Keep pinned template versions on the latest build
        run: |
          pin() {
            t="$1"; shift
            cur=$(node -p "require('./dist/templates/$t/manifest.json').version")
            for v in "$@"; do
              [ "$v" = "$cur" ] && continue
              mkdir -p "dist/templates/$t/$v"
              cp -R "dist/templates/$t/$cur/." "dist/templates/$t/$v/"
            done
          }
          pin viraj-technologies 1.0.162

      # A page that loaded a template's manifest just before a deploy (Pages caches it 10 min,
      # Refrens may cache longer) asks for the previous version's files, which a deploy removes
      # ("Failed to load CSS .../1.0.45/bundle.css"). Each template's last 20 versions are kept
      # as copies of the latest build, so a stale manifest still loads (and gets the latest code).
      - name: Keep recent template versions on the latest build
        run: |
          for m in dist/templates/*/manifest.json; do
            dir=$(dirname "$m")
            cur=$(node -p "require('./$m').version")
            IFS=. read -r major minor patch <<< "$cur"
            for i in $(seq 1 20); do
              p=$((patch - i)); [ "$p" -lt 0 ] && break
              v="$major.$minor.$p"
              [ -e "$dir/$v" ] && continue
              mkdir -p "$dir/$v"
              cp -R "$dir/$cur/." "$dir/$v/"
            done
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check Pages
        run: |
          echo "If deployment fails:"
          echo "Go to Settings → Pages"
          echo "Set source to GitHub Actions"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
