<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ceres - Custom Document Renderer</title>
    <script src="https://unpkg.com/handlebars@4.7.8/dist/handlebars.runtime.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f8f8f8;
        display: flex;
        justify-content: center;
        align-items: flex-start; /* Align to top */
        min-height: 100vh;
      }

      @media print {
        body {
          padding: 0px !important;
          margin: 0px !important;
          height: fit-content !important;
          background-color: none !important;
        }
      }

      .error-message {
        color: red;
        text-align: center;
      }

      .loading-message {
        text-align: center;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div id="documentOutput" class="loading-message">
      Trying to load document...
    </div>
    <script>
      // Simple base64 decoder (atob = ASCII to Binary = decode base64)
      function decodeBase64(encoded) {
        try {
          return atob(encoded);
        } catch (e) {
          return null;
        }
      }

      // Support external template manifest URL override, or use query parameter
      const urlParams = new URLSearchParams(window.location.search);
      const encodedTemplateManifestUrl =
        urlParams.get("templateManifest") || urlParams.get("template");
      let templateManifestUrl = window.templateManifestUrl;

      // Decode base64 templateManifest URL if provided
      if (encodedTemplateManifestUrl) {
        const decodedValue = decodeBase64(encodedTemplateManifestUrl);
        if (!decodedValue) {
          document.getElementById("documentOutput").innerHTML =
            "Error: could not decode templateManifest URL";
        } else {
          // Check if decoded value is a URL (starts with http) or a template name
          if (
            decodedValue.startsWith("http://") ||
            decodedValue.startsWith("https://")
          ) {
            // It's a full URL
            templateManifestUrl = decodedValue;
          } else {
            // It's a template name, construct the local path
            templateManifestUrl = `./templates/${decodedValue}/manifest.json`;
          }
        }
      }

      if (templateManifestUrl) {
        // Load the specific template manifest directly
        fetch(templateManifestUrl)
          .then((r) => {
            if (!r.ok) {
              throw new Error("Failed to fetch template manifest: " + r.status);
            }
            return r.json();
          })
          .then((templateManifest) => {
            // Store template manifest globally for main renderer
            window.CeresTemplateManifest = templateManifest;
            window.CeresTemplateManifestUrl = templateManifestUrl;

            // Now load the main renderer
            return fetch("./main-manifest.json");
          })
          .then((r) => {
            if (!r.ok)
              throw new Error("Failed to fetch main manifest: " + r.status);
            return r.json();
          })
          .then((manifest) => {
            if (!manifest.js)
              throw new Error("Renderer JS not found in main manifest");
            if (manifest.css) {
              const link = document.createElement("link");
              link.rel = "stylesheet";
              link.href = "./" + manifest.css;
              document.head.appendChild(link);
            }
            const script = document.createElement("script");
            script.src = "./" + manifest.js;
            script.onerror = () => {
              document.getElementById("documentOutput").innerHTML =
                "Error: Failed to load renderer script";
            };
            document.head.appendChild(script);
          })
          .catch((err) => {
            document.getElementById("documentOutput").innerHTML =
              "Error: " + err.message;
          });
      } else {
        // No template manifest URL provided
        document.getElementById("documentOutput").innerHTML =
          "Error: No template manifest URL provided. Use ?templateManifest=<url> or set window.templateManifestUrl";
      }
    </script>
  </body>
</html>
