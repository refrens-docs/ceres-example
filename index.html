<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ceres - Custom Document Renderer</title>
    <script src="https://unpkg.com/handlebars@4.7.8/dist/handlebars.runtime.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background-color: #f8f8f8;
        display: flex;
        justify-content: center;
        align-items: flex-start; /* Align to top */
        min-height: 100vh;
      }

      @media print {
        body {
          padding: 0px !important;
          margin: 0px !important;
          height: fit-content !important;
          background-color: none !important;
        }
      }

      .error-message {
        color: red;
        text-align: center;
      }

      .loading-message {
        text-align: center;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div id="documentOutput" class="loading-message">
      Trying to load document...
    </div>
    <script>
      // Minimal bootstrap: Load main renderer and let it handle everything else
      fetch("./main-manifest.json")
        .then(function (r) {
          if (!r.ok) {
            throw new Error("Failed to fetch main manifest: " + r.status);
          }
          return r.json();
        })
        .then(function (manifest) {
          if (!manifest.js) {
            throw new Error("Renderer JS not found in main manifest");
          }

          // Load main renderer JS
          var script = document.createElement("script");
          script.src = "./" + manifest.js;
          script.onerror = function () {
            document.getElementById("documentOutput").innerHTML =
              "Error: Failed to load renderer script";
          };
          document.head.appendChild(script);
        })
        .catch(function (err) {
          document.getElementById("documentOutput").innerHTML =
            "Error: " + err.message;
        });

      // ---- Dynamic iframe height communication ----
      let lastHeight = 0;
      let lastPrintHeight = 0;
      let resizeTimeout;

      function sendHeight(isPrint = false) {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          const height = isPrint ? calculatePrintHeight() : calculateWebHeight();
          const messageType = isPrint ? 'setPrintHeight' : 'setHeight';
          const lastUsedHeight = isPrint ? lastPrintHeight : lastHeight;
          
          if (height !== lastUsedHeight) {
            if (isPrint) {
              lastPrintHeight = height;
            } else {
              lastHeight = height;
            }
            
            window.parent.postMessage({ 
              type: messageType, 
              height,
              ...(isPrint && { printMode: true })
            }, "*");
          }
        }, 50);
      }

      function calculateWebHeight() {
        const BUFFER = 64;
        return document.documentElement.scrollHeight + BUFFER;
      }

      function calculatePrintHeight() {
        // Get actual computed styles from the document
        const body = document.body;
        const computedStyle = window.getComputedStyle(body);
        const documentOutput = document.getElementById('documentOutput');
        const contentStyle = documentOutput ? window.getComputedStyle(documentOutput) : computedStyle;
        
        // Extract real values from the template
        const actualFontSize = contentStyle.fontSize || '12pt';
        const actualLineHeight = contentStyle.lineHeight || '1.4';
        const actualFontFamily = contentStyle.fontFamily || 'Arial, sans-serif';
        
        // Detect paper size from CSS @page or use A4 as fallback
        const printWidth = getPrintWidth() || '210mm';
        
        // Create off-screen print simulator with REAL template values
        const measurer = document.createElement('div');
        measurer.style.cssText = `
          position: absolute; top: -9999px; left: -9999px; visibility: hidden;
          width: ${printWidth}; 
          font-size: ${actualFontSize}; 
          line-height: ${actualLineHeight};
          font-family: ${actualFontFamily};
          padding: 20mm; margin: 0; box-sizing: border-box; 
          background: white; color: black;
        `;
        
        const content = document.getElementById('documentOutput') || document.body;
        measurer.innerHTML = content.innerHTML;
        document.body.appendChild(measurer);
        
        // Force layout and measure
        measurer.offsetHeight;
        const printHeight = measurer.scrollHeight + 300; // Generous buffer for print safety
        
        document.body.removeChild(measurer);
        return printHeight;
      }

      function getPrintWidth() {
        // Try to detect @page size from CSS
        try {
          const sheets = document.styleSheets;
          
          for (let i = 0; i < sheets.length; i++) {
            const sheet = sheets[i];
            
            try {
              const rules = sheet.cssRules || sheet.rules;
              
              for (let j = 0; j < rules.length; j++) {
                const rule = rules[j];
                if (rule.type === CSSRule.PAGE_RULE) {
                  const width = rule.style.width || rule.style.size;
                  if (width) {
                    return width;
                  }
                }
              }
            } catch (e) {
              // Cross-origin stylesheet, skip
            }
          }
        } catch (e) {
          // Error accessing stylesheets
        }
        
        return '210mm'; // A4 width
      }

      // Event listeners
      window.addEventListener("load", () => sendHeight(false));
      
      const observer = new ResizeObserver(() => sendHeight(false));
      observer.observe(document.body);
      
      window.addEventListener("message", (event) => {
        const { type } = event.data || {};
        if (type === "requestHeight") sendHeight(false);
        if (type === "requestPrintHeight") sendHeight(true);
      });
      
      window.addEventListener("beforeprint", () => sendHeight(true));
    </script>
  </body>
</html>
